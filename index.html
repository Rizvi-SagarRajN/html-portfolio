<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #f4f4f4;
        }
        header {
            background-color: #333;
            color: white;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            margin-top: 20px;
            padding: 10px;
            background: #333;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Web Page</h1>
    </header>
    <div class="container">
        <h2>About Me</h2>
        <p>This is a simple static webpage designed to introduce myself. You can customize this as you like!</p>
        <h3><a href="./public/NewsWebsites.html">News websites</a></h3>
        <p>Above link gives the list of news websites that I follow!</p>
        <h2>Contact</h2>
        <p>Email: sagarrajn@outlook.com</p>
    </div>
    <footer>
        <p>&copy; 2025 My Web Page</p>
    </footer>
</body>
</html>
